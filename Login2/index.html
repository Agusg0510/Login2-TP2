<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesion y Registro</title>
    <link rel="stylesheet" href="style.css">
    <!-- Basic Icons -->
<link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
<!-- Filled Icons -->
<link href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css" rel="stylesheet">
<!-- Brand Icons -->
<link href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <span class="bg-animate"></span>
        <span class="bg-animate2"></span>

        <div class="form-box login">
            <h2 class="animation" style="--i:0; --j:22;">Iniciar Sesión</h2>
            <form action="#">
                <div class="input-box animation" style="--i:1; --j:23;">
                    <input type="text" required>
                    <label>Nombre de Usuario</label>
                    <i class="bx bx-user"></i>
                </div>
                <div class="input-box animation" style="--i:2; --j:24;">
                    <input type="password" required>
                    <label>Contraseña</label>
                    <i class="bx bx-lock"></i>
                </div>
                <button class="btn animation" style="--i:3; --j:25;" type="submit">Iniciar Sesión</button>
                <div class="logreg-link animation" style="--i:4; --j:26;">
                    <p>
                        No tienes una cuenta?
                        <a href="#" class="register-link">Registrate</a>
                    </p>
                </div>
            </form>
        </div>
        <div class="info-text login">
            <h2 class="animation" style="--i:0; --j:21;">Estas de vuelta!</h2>
            <p class="animation" style="--i:1; --j:22;">Lorem ipsum, dolor sit amet consectetur asipisicing.</p>
        </div>


         <div class="form-box register">
            <h2 class="animation" style="--i:18; --j:0;">Registrarse</h2>
            <form action="#">
                <div class="input-box animation" style="--i:19; --j:1;">
                    <input type="text" required>
                    <label>Nombre de Usuario</label>
                    <i class="bx bx-user"></i>
                </div>
                <div class="input-box animation" style="--i:20; --j:2;">
                    <input type="text" required>
                    <label>Email</label>
                    <i class="bx bx-envelope"></i>
                </div>
                <div class="input-box animation" style="--i:21; --j:3;">
                    <input type="password" required>
                    <label>Contraseña</label>
                    <i class="bx bx-lock"></i>
                </div>
                <button class="btn animation" style="--i:22; --j:4;" type="submit">Registrarse</button>
                <div class="logreg-link animation" style="--i:23; --j:5;">
                    <p>
                        Ya tienes una cuenta?
                        <a href="#" class="login-link">Inicia Sesión</a>
                    </p>
                </div>
            </form>
        </div>

        <div class="info-text register">
            <h2 class="animation" style="--i:18; --j:0;">Estas de vuelta!</h2>
            <p class="animation" style="--i:19; --j:1;">Lorem ipsum, dolor sit amet consectetur asipisicing.</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
